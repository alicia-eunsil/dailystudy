name: Check English Mail
on:
  push:
    paths: ['study_mail.py', 'curriculum/**', 'tests/**', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python study_mail.py validate
      - run: python -m unittest discover -s tests -v
