name: Daily English

on:
  schedule:
    # UTC Sunday–Thursday 22:00 = Asia/Seoul Monday–Friday 07:00
    - cron: '0 22 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: 미리보기 / send: 오늘의 메일 실제 발송'
        type: choice
        options: [preview, send]
        default: preview

permissions:
  contents: write

concurrency:
  group: daily-english-mail
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate curriculum and behavior
        run: |
          python study_mail.py validate
          python -m unittest discover -s tests -v
      - name: Preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: python study_mail.py preview
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        with:
          name: email-preview
          path: preview/
      - name: Reserve today's email
        id: reserve
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python study_mail.py reserve
      - name: Persist reservation before sending
        if: steps.reserve.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mail_state/state.json
          git commit -m 'Reserve daily English email'
          git push origin HEAD:main
      - name: Send via Gmail
        if: steps.reserve.outputs.ready == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RESERVED_DAY: ${{ steps.reserve.outputs.day }}
        run: python study_mail.py send
      - name: Record successful send
        if: steps.reserve.outputs.ready == 'true'
        run: |
          git add mail_state/state.json
          git commit -m 'Record daily English delivery'
          git push origin HEAD:main
